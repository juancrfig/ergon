# Hermes profile of the wiki-maintainer, the agent of the Intake node.
# Owned by the ergon repo: `ergon profile install wiki-maintainer` copies this file verbatim, and every run
# refuses to start if the installed copy differs (ADR 0006).
model:
  default: claude-sonnet-5-5
  provider: anthropic
  base_url: https://api.anthropic.com
memory:
  memory_enabled: false
  user_profile_enabled: false
