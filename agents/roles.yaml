# Global roles. Paths are relative to this agents/ folder.
# `base` is given to every worker and reviewer, before the task's roles.
# The reviewer of a task always receives the worker's rules as well as its own.
# The main agent passes a role's rules and skills to the subagent it delegates to. Subagents get the main agent's
# tools, so roles have no `tools` field.
base:
  rules:
    - rules/tests-and-verification-need-human-approval.md
    - rules/comments-state-why-not-what.md
    - rules/install-reconciles-canonical-declarations.md
    - rules/second-order-thinking-checks.md
    - rules/decide-small-changes-without-approval.md
    - rules/long-steps-run-in-background.md
  skills:
    - skills/systematic-debugging
worker: {}
reviewer:
  skills:
    - skills/code-review
frontend:
  rules:
    - rules/overlays-escape-clipping-ancestors.md
    - rules/clickable-hover-feedback.md
    - rules/color-contrast-preflight.md
    - rules/keyboard-focus-only.md
    - rules/keyframe-stops-use-concrete-values.md
    - rules/motion-by-frequency-and-purpose.md
    - rules/no-hardcoded-colors.md
    - rules/no-surprise-scrollbars.md
    - rules/scrollbar-default-style.md
    - rules/state-synced-css-animations.md
    - rules/bound-visual-fix-loops.md
  skills:
    - skills/smooth-frontend
