# Canonical Hermes config for every node profile (ADR 0019).
# Ergon applies it before each run: every key here, down to the second level, replaces the profile's own, so this
# file wins over hand edits; keys it does not set stay. Same shape as ~/.hermes/profiles/<name>/config.yaml. Keep to plain YAML.
#
# It applies to every agent in Ergon: each node runs it on its own profile before its first agent call.
# Not here on purpose: model, provider and credentials. The human sets them by hand (ADR 0011).
# Everything else a profile holds is left alone.

# The read-only wiki tool (ADR 0016). Ergon sets both variables per run; MCP resource and prompt helpers stay off.
mcp_servers:
  ergon:
    command: python3
    args:
    - ${ERGON_TOOL}
    - ${ERGON_RUN}
    tools:
      resources: false
      prompts: false

# Hermes' own system prompt sections that do not fit a read-only agent answering in JSON (ADR 0017).
agent:
  coding_context: 'off'
  task_completion_guidance: false
  parallel_tool_call_guidance: false
  tool_use_enforcement: false
  execution_guidance: false
  environment_probe: false
  bot_mode_protocol: false

platform_hints:
  cli:
    replace: Code reads your final answer, not a person.

# Tool search hides the wiki tool behind three lookup tools, which costs turns (ADR 0017).
tools:
  tool_search:
    enabled: 'off'

# Ergon runs through the CLI, where Hermes only warns about a replayed tool call. Stop it instead.
tool_loop_guardrails:
  hard_stop_enabled: true

# Context compression, the same as theSystem's main agent, except protect_first_n: the first message is the
# prompt with the whole source, so it is never summarized.
compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  threshold_tokens: 150000
  target_ratio: 0.2
  protect_last_n: 15
  min_tail_user_messages: 5
  max_attempts: 3
  proactive_prune_tokens: 0
  micro_compact: false
  protect_first_n: 1
  abort_on_summary_failure: true
  idle_compact_after_seconds: 0

# Code reads the answer from what Hermes prints; reasoning in the output could hold JSON drafts.
display:
  show_reasoning: false

# Ergon agents read no memory (--ignore-rules) and have no memory or skill tool, so Hermes' post-run reviews cannot
# fire. Memory off says so outright.
memory:
  memory_enabled: false
  user_profile_enabled: false

# Ergon reads the profile's session store right after each run, while Hermes may still write to it.
database:
  journal_mode: wal

telemetry:
  shared_metrics:
    enabled: false

# The date in the model's instructions.
timezone: America/Bogota
